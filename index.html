<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Дневник тренировок</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#000000;
    --surface:#1C1C1E;
    --surface-2:#2C2C2E;
    --surface-3:#3A3A3C;
    --separator:#38383A;
    --text:#FFFFFF;
    --text-muted:#98989F;
    --text-faint:#5B5B60;
    --accent:#0091FF;
    --green:#30D158;
    --green-tint:#1F3526;
    --red:#FF4245;
    --orange:#FF9230;
    --radius-l:26px;
    --radius-s:10px;
    --font:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-display:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:15px;
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  header{margin:6px 4px 14px;}
  h1{
    font-family:var(--font-display);
    font-size:30px;
    font-weight:700;
    letter-spacing:0.2px;
    margin:0;
  }
  header .date{
    font-size:15px;
    color:var(--text-muted);
    margin-top:2px;
  }
  .ico{
    width:22px;
    height:22px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* Grouped sections */
  .card{
    background:var(--surface);
    border-radius:var(--radius-l);
    padding:16px 18px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .card.list{padding:0;}
  .list > :not(.row){
    margin-left:18px;
    padding-right:18px;
    border-bottom:0.5px solid var(--separator);
  }
  .list > :not(.row):last-child{border-bottom:none;}
  .section-title{
    font-size:13px;
    color:var(--text-muted);
    margin:22px 18px 7px;
  }
  .lib-note{
    font-size:13px;
    color:var(--text-muted);
    margin:-6px 18px 18px;
  }
  .eyebrow{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 4px;
  }

  /* Rows (iOS table cells) */
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:0 0 0 18px;
    background:none;
    border:none;
    color:var(--text);
    font:inherit;
    text-align:left;
  }
  button.row{cursor:pointer;}
  button.row:active{background:var(--surface-3);}
  .row-body{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:50px;
    padding:11px 18px 11px 0;
    border-bottom:0.5px solid var(--separator);
  }
  .row:last-child .row-body{border-bottom:none;}
  .row-body > .ico{width:15px; height:15px; color:var(--text-faint); stroke-width:2.6;}
  .row-label{font-size:16px;}
  .row-label.accent{color:var(--accent);}
  .row-value{
    font-size:16px;
    color:var(--text-muted);
    text-align:right;
  }
  .row-text{display:flex; flex-direction:column; gap:2px;}
  .row-sub{font-size:13px; color:var(--text-muted);}
  .row input{
    flex:1;
    min-width:0;
    background:none;
    border:none;
    color:var(--text);
    font:inherit;
    font-size:16px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    padding:0;
  }
  .row input:focus{outline:none;}
  .row input::placeholder{color:var(--text-faint);}
  .row-unit{font-size:16px; color:var(--text-muted); width:26px;}
  .icon-sq{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .icon-sq .ico{width:18px; height:18px;}
  .check{display:flex; color:var(--accent);}
  .check .ico{width:20px; height:20px; stroke-width:2.6;}

  /* Buttons */
  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    padding:14px 18px;
    border-radius:999px;
    font-size:17px;
    font-weight:600;
    border:none;
    cursor:pointer;
  }
  .btn:active{filter:brightness(0.85);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-outline{background:var(--surface-2); color:var(--text);}
  .btn-ghost{
    background:none;
    border:none;
    padding:8px 0;
    width:auto;
    font-size:15px;
    color:var(--accent);
    cursor:pointer;
  }
  .row-2{display:flex; gap:10px;}
  .row-2 .btn{flex:1;}
  .settings-link{text-align:center; margin-top:18px;}
  .settings-link .btn-ghost{color:var(--red);}

  /* Tab bar */
  .tabbar{
    display:flex;
    align-items:center;
    gap:2px;
    margin-bottom:16px;
    padding:4px;
    background:var(--surface-2);
    border-radius:999px;
  }
  .tabbar button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    color:var(--text-muted);
    font-size:10px;
    font-weight:600;
    padding:7px 2px 6px;
    border-radius:999px;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--accent); background:#161618;}

  /* Today */
  .hero-type{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:700;
    margin:0 0 6px;
  }
  .exercise-preview{
    font-size:14px;
    color:var(--text-muted);
    margin:8px 0 16px;
  }
  .stats{display:flex; gap:14px; margin-top:16px;}
  .stat{flex:1;}
  .stat .num{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .stat .lbl{font-size:12px; color:var(--text-muted);}
  .strip{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .day-sq{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:600;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .day-sq.done{background:var(--green); color:#00210B;}
  .day-sq.today{box-shadow:0 0 0 2px var(--accent); color:var(--text);}

  /* Workout */
  .exercise{margin-bottom:22px;}
  .exercise:last-child{margin-bottom:0;}
  .exercise h3{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    margin:0 0 2px;
  }
  .exercise .target,
  .lib-row .target{font-size:13px; color:var(--text-muted); margin:0 0 3px;}
  .exercise .last-time{font-size:13px; color:var(--text-muted); margin:0 0 10px;}
  .ex-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .video-btn{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:13px;
    font-weight:600;
    color:var(--accent);
    background:var(--surface-2);
    border-radius:999px;
    padding:6px 11px;
    text-decoration:none;
    white-space:nowrap;
  }
  .video-btn .ico{width:11px; height:11px; fill:currentColor; stroke:none;}
  .exercise .advice{
    font-size:13px;
    color:var(--text-muted);
    margin:-2px 0 10px;
    padding:9px 12px;
    border-radius:12px;
    background:var(--green-tint);
  }
  .exercise .advice b{color:var(--green); font-size:15px; font-weight:600; white-space:nowrap;}
  .set-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .set-row .set-label{
    width:18px;
    font-size:13px;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .set-row input,
  .cfg-inputs input{
    width:100%;
    background:var(--surface-2);
    border:none;
    color:var(--text);
    border-radius:var(--radius-s);
    padding:9px 10px;
    font:inherit;
    font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .set-row input::placeholder{color:var(--text-faint);}
  .set-row input:focus-visible,
  .cfg-inputs input:focus-visible{outline:2px solid var(--accent); outline-offset:0;}
  .set-row .unit{font-size:13px; color:var(--text-muted); width:20px;}
  .set-row .done-toggle{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1.5px solid #48484A;
    background:none;
    color:#fff;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .set-row .done-toggle.on{background:var(--green); border-color:var(--green);}

  /* Lists: exercises, settings, history, progress, plan */
  .lib-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
  }
  .lib-name{font-size:16px; margin-bottom:2px;}
  .lib-advice{font-size:13px; color:var(--green); margin-top:2px;}
  .cfg-row{padding:12px 0 14px;}
  .cfg-name{font-size:16px; margin-bottom:10px;}
  .cfg-inputs{display:flex; gap:10px;}
  .cfg-inputs label{
    flex:1;
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .hist-item summary{
    padding:13px 0;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:16px;
    list-style:none;
  }
  .hist-item summary::-webkit-details-marker{display:none;}
  .hist-item summary .row-value{display:inline-flex; align-items:center; gap:6px;}
  .hist-item summary .ico{width:14px; height:14px; color:var(--text-faint); stroke-width:2.6; transition:transform .2s;}
  .hist-item[open] summary .ico{transform:rotate(90deg);}
  .hist-body{padding:0 0 12px;}
  .hist-ex{font-size:14px; padding-top:8px;}
  .hist-ex b{font-weight:600;}
  .hist-ex .sets-txt{color:var(--text-muted);}
  .progress-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:13px 0;
    font-size:16px;
  }
  .progress-row .pval{
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .progress-row .next-load{display:block; font-size:13px;}
  .progress-row .next-load.up{color:var(--green);}
  .progress-row .next-load.down{color:var(--orange);}
  .plan-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:12px 0;
    font-size:15px;
  }
  .plan-row .plan-sets{
    color:var(--text-muted);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .plan-row .plan-load{display:block; text-align:right; color:var(--green); font-size:13px;}
  .empty{
    color:var(--text-muted);
    font-size:15px;
    text-align:center;
    padding:24px 0;
  }

  /* Quiz */
  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 4px;
  }
  .quiz-step{font-size:13px; color:var(--text-muted);}
  .quiz-bar{
    height:4px;
    border-radius:2px;
    background:var(--surface-3);
    margin:6px 4px 20px;
    overflow:hidden;
  }
  .quiz-bar span{display:block; height:100%; border-radius:2px; background:var(--accent);}
  .quiz-title{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:700;
    margin:0 4px 6px;
  }
  .quiz-sub{font-size:14px; color:var(--text-muted); margin:0 4px 16px;}
  .card .quiz-title,
  .card .quiz-sub{margin-left:0; margin-right:0;}
  .segmented{
    display:flex;
    background:var(--surface);
    border-radius:999px;
    padding:3px;
    margin-bottom:14px;
  }
  .segmented button{
    flex:1;
    background:none;
    border:none;
    color:var(--text);
    font-size:15px;
    font-weight:600;
    padding:9px;
    border-radius:999px;
    cursor:pointer;
  }
  .segmented button.on{background:var(--surface-3);}
  .quiz-error{color:var(--red); font-size:14px; margin:-4px 4px 14px;}
  .banner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:#3A2A12;
    color:#FFD8A8;
    border-radius:var(--radius-s);
    padding:10px 14px;
    margin-bottom:14px;
    font-size:14px;
  }
  .banner button{
    background:none;
    border:none;
    color:var(--orange);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:0;
  }
  .notes{margin:12px 0 0; padding-left:18px; font-size:14px;}
  .notes li{margin-bottom:6px;}
  .notes li:last-child{margin-bottom:0;}
  .notes li::marker{color:var(--text-muted);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DEFAULT_PROGRAM = {
  A: [
    { name: 'Приседания со штангой', sets: 3, repsMin: 8, repsMax: 10 },
    { name: 'Жим штанги лёжа', sets: 3, repsMin: 8, repsMax: 10 },
    { name: 'Тяга штанги в наклоне', sets: 3, repsMin: 8, repsMax: 10 },
    { name: 'Жим гантелей сидя', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Разгибание ног в тренажёре', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Разгибание рук на блоке', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Подъём гантелей на бицепс', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Планка', sets: 3, repsMin: 30, repsMax: 45, isTime: true },
    { name: 'Русские скручивания', sets: 3, repsMin: 15, repsMax: 20 }
  ],
  B: [
    { name: 'Становая тяга', sets: 3, repsMin: 6, repsMax: 8 },
    { name: 'Жим ногами / выпады', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Сгибание ног в тренажёре', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Тяга верхнего блока', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Жим гантелей на наклонной скамье', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Разведение гантелей в стороны', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Подъём ног в висе', sets: 3, repsMin: 15, repsMax: 15 },
    { name: 'Скручивания на блоке', sets: 3, repsMin: 15, repsMax: 20 }
  ]
};
const TYPE_LABELS = { A: 'Тренировка A', B: 'Тренировка B' };
const TABS = [
  { id: 'today', label: 'Сегодня', icon: 'home' },
  { id: 'exercises', label: 'Упражнения', icon: 'dumbbell' },
  { id: 'settings', label: 'Настройки', icon: 'gear' },
  { id: 'history', label: 'История', icon: 'clock' },
  { id: 'progress', label: 'Прогресс', icon: 'chart' }
];
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5.5h4V20"/>',
  dumbbell: '<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  gear: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  chart: '<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16V9"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  ruler: '<path d="M3.5 16.5 16.5 3.5l4 4-13 13z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.1a4.3 4.3 0 0 1 7.5 2.7C19.5 15.4 12 20 12 20z"/>',
  target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  star: '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/>',
  pin: '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  aid: '<rect x="3.5" y="6.5" width="17" height="13" rx="2.5"/><path d="M9 6.5V4h6v2.5M12 10v6M9 13h6"/>',
  play: '<path d="M7 4.5v15l12.5-7.5z"/>',
  chevron: '<path d="M9.5 6l6 6-6 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  send: '<path d="M21 3.5 3 10.8l6.8 2.4L12.2 20z"/><path d="M9.8 13.2 21 3.5"/>',
  stairs: '<path d="M3 19h5v-4.5h5V10h5V5.5h3"/>'
};
function icon(name){
  return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
}

// Each slot lists variants from preferred to gentlest; the first one that fits
// the equipment and has no conflicting tag wins. First variants = DEFAULT_PROGRAM.
const EQ_RANK = { none: 0, dumbbells: 1, gym: 2 };
const SLOTS = {
  A: [
    { variants: [
      { name: 'Приседания со штангой', eq: 'gym', role: 'main', avoid: ['beginner','senior','caution','knees','back'] },
      { name: 'Гоблет-присед с гантелью', eq: 'dumbbells', role: 'main', avoid: ['knees'] },
      { name: 'Жим ногами в тренажёре', eq: 'gym', role: 'main' },
      { name: 'Приседания на скамью', eq: 'none', role: 'main' }
    ]},
    { variants: [
      { name: 'Жим штанги лёжа', eq: 'gym', role: 'main', avoid: ['shoulders'] },
      { name: 'Жим гантелей лёжа', eq: 'gym', role: 'main' },
      { name: 'Жим гантелей лёжа на полу', eq: 'dumbbells', role: 'main' },
      { name: 'Отжимания', eq: 'none', role: 'main', avoid: ['beginner','bmi','caution','shoulders'] },
      { name: 'Отжимания от опоры', eq: 'none', role: 'main' }
    ]},
    { variants: [
      { name: 'Тяга штанги в наклоне', eq: 'gym', role: 'main', avoid: ['beginner','caution','back'] },
      { name: 'Тяга горизонтального блока', eq: 'gym', role: 'main' },
      { name: 'Тяга гантели в наклоне с опорой', eq: 'dumbbells', role: 'main' },
      { name: 'Тяга рюкзака в наклоне', eq: 'none', role: 'main' }
    ]},
    { variants: [
      { name: 'Жим гантелей сидя', eq: 'dumbbells', role: 'main', avoid: ['shoulders'] },
      { name: 'Пайк-отжимания', eq: 'none', role: 'main', avoid: ['beginner','bmi','caution','shoulders'] },
      { name: 'Тяга к лицу на блоке', eq: 'gym', role: 'iso' },
      { name: 'Разведение гантелей в наклоне', eq: 'dumbbells', role: 'iso' },
      { name: 'Y-подъёмы лёжа', eq: 'none', role: 'iso' }
    ]},

  const age = p.age < 18 || p.age >= 60 ? 0.8 : p.age >= 50 ? 0.9 : 1;

    return allTop ? { weight: null, text: 'все подходы по ' + cfg.repsMax + '+ сек — добавьте 5–10 секунд' } : null;
  }
  if (perf){
    const top = Math.max(...perf.sets.map(s => Number(s.value1) || 0));
    const reps = perf.sets.map(s => Number(s.value2) || 0);
    const allTop = perf.sets.length >= cfg.sets && reps.every(r => r >= cfg.repsMax);
    if (!load) return allTop ? { weight: null, text: 'все подходы на максимум — усложните вариант упражнения или добавьте повторения' } : null;
    if (top > 0){
      if (allTop){
        const next = Math.min(EQUIP[load.eq].max, top + loadStep(top, load));
        return next > top
          ? { weight: next, trend: 'up', text: 'прошлый раз ' + kg(top) + ' кг во всех подходах на ' + cfg.repsMax + '+ повторений — добавьте вес' }

        return { weight: lighter, trend: 'down', text: 'прошлый раз с ' + kg(top) + ' кг не хватило повторений — снизьте вес' };

      return { weight: top, text: 'оставьте вес и добейте до ' + cfg.repsMax + ' повторений во всех подходах' };

function stageInfo(p, doneCount){
  const done = doneCount == null ? sessions.length : doneCount;

  let index = STAGES.length - 1;
  let left = 0;
  if (p.level === 'beginner'){
    let rest = done;
    index = 0;
    while (index < STAGES.length - 1 && rest >= STAGES[index].workouts){
      rest -= STAGES[index].workouts;
      index++;

    left = STAGES[index].workouts - rest;

  return {
    index,
    ramping: p.level === 'beginner' && index < STAGES.length - 1,
    done: index < STAGES.length - 1 ? STAGES[index].workouts - left : 0,
    total: STAGES[index].workouts,
    title: STAGES[index].title,
    note: STAGES[index].note,
    load: STAGES[index].load,
    slots: Math.min(index + 1, limit)

  const reps = REPS[tags.has('caution') ? 'health' : p.goal];
  const stage = stageInfo(p, doneCount);
  const result = {};
  ['A', 'B'].forEach(type => {
    const used = new Set();
    result[type] = SLOTS[type]
      .filter(slot => (slot.stage || 1) <= stage.slots)
      .map(slot => {
        const fits = slot.variants.filter(v => EQ_RANK[v.eq] <= rank && !used.has(v.name));
        const v = fits.find(v => !(v.avoid || []).some(t => tags.has(t))) || fits[fits.length - 1];
        used.add(v.name);
        let [repsMin, repsMax] = reps[v.role];
        if (v.role === 'main' && repsMin < 8 && (tags.has('senior') || tags.has('young'))) [repsMin, repsMax] = [8, 10];
        return { name: v.name, sets: setsFor(v.role, tags, p, stage), repsMin, repsMax, isTime: v.role === 'time' };

  if (p.goal === 'loss' && bmiOf(p) < 18.5) notes.push('Ваш ИМТ ниже нормы — худеть не стоит. Возможно, вам больше подойдёт цель «Набрать мышечную массу».');
  else if (p.goal === 'loss') notes.push('Для снижения веса главное — питание с небольшим дефицитом калорий. Добавьте 30–40 минут ходьбы в дни без тренировок.');
  if (p.place === 'none') notes.push('Понадобятся подручные предметы: рюкзак с книгами или бутылками воды, устойчивый стул и полотенце.');
  notes.push('Веса ниже — стартовый ориентир по вашим данным. Если последние 2 повторения не даются с хорошей техникой — снизьте вес.');
  notes.push('Дальше вес подсказывается по прошлой тренировке: сделали верхнюю границу повторений во всех подходах — приложение предложит добавить вес, не добрали — оставить или снизить.');
  notes.push('Чередуйте тренировки A и B, между ними — хотя бы день отдыха.');
  return notes;
}

  quiz.step += delta;
  quiz.error = '';
  render();
  window.scrollTo(0, 0);

function quizChoose(i){
  const step = QUIZ[quiz.step];
  if (!step.multi){
    quiz.answers[step.id] = step.options[i][0];
    quizGo(1);
    return;
  }
  const value = step.options[i] ? step.options[i][0] : null;
  const list = quiz.answers.limits;
  if (value === null) list.length = 0;
  else if (list.includes(value)) list.splice(list.indexOf(value), 1);
  else list.push(value);
  render();
}
function quizNext(){
  const a = quiz.answers;
  if (QUIZ[quiz.step].id === 'body'){
    quiz.error =
      !a.sex ? 'Выберите пол' :
      !(a.age >= 12 && a.age <= 100) ? 'Укажите возраст — от 12 до 100 лет' :
      !(a.height >= 120 && a.height <= 230) ? 'Укажите рост в сантиметрах — от 120 до 230' :
      !(a.weight >= 30 && a.weight <= 250) ? 'Укажите вес в килограммах — от 30 до 250' : '';
    if (quiz.error){ render(); return; }
  }
  quizGo(1);

function storeSession(s){
  session = s;
  try {
    if (s) localStorage.setItem('session', JSON.stringify(s));
    else localStorage.removeItem('session');
    localStorage.removeItem('training-log:token');
  } catch (e) {}

async function authRequest(body){
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Не удалось войти');
  return { token: data.token, name: data.name };
}
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
async function loadAll(){
  try{
    const res = await fetch('/api/data', { headers: apiHeaders() });
    if (res.status === 401) return { status: 'login' };
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { status: 'error', message: data.error || 'Ошибка сервера ' + res.status };
    return {
      status: 'ok',
      sessions: Array.isArray(data.sessions) ? data.sessions : [],
      overrides: (data.overrides && typeof data.overrides === 'object') ? data.overrides : {},
      profile: (data.profile && typeof data.profile === 'object') ? data.profile : null,
      draft: data.draft || null
    };
  }catch(e){
    console.error('Load error', e);
    return { status: 'error', message: 'Нет связи с сервером' };
  }
}
async function saveAll(){
  clearTimeout(saveTimer);
  try{
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: apiHeaders(),
      body: JSON.stringify({
        sessions,
        overrides,
        profile,
        draft: activeType && draft ? { type: activeType, exercises: draft } : null
      })
    });
    if (res.status === 401){
      storeSession(null);
      loginError = 'Сессия истекла — войдите снова';
      showLogin();
      return;
    }
    if (!res.ok) throw new Error('bad status ' + res.status);
    if (saveFailed){ saveFailed = false; render(); }
  }catch(e){
    console.error('Save error', e);
    saveFailed = true;
    render();
  }
}

function scheduleSave(){

function updateOverride(name, field, value){
  const num = parseInt(value, 10);
  if (!overrides[name]) overrides[name] = {};
  if (!isNaN(num) && num > 0) overrides[name][field] = num;
  else delete overrides[name][field];
  if (Object.keys(overrides[name]).length === 0) delete overrides[name];
}

function startWorkout(type, prefill){
  activeType = type;
  draft = program[type].map(ex => {
    const cfg = getConfig(ex);
    const prev = prefill && prefill.exercises.find(e => e.name === ex.name);
    const advice = weightAdvice(cfg, profile, todayStr());
    const suggested = advice && advice.weight ? String(advice.weight) : '';
    return {
      name: ex.name,
      target: targetText(cfg),
      isTime: !!ex.isTime,
      advice,
      sets: Array.from({length: cfg.sets}, (_, i) => ({
        value1: prev && prev.sets[i] ? prev.sets[i].value1 : (prev ? '' : suggested),
        value2: prev && prev.sets[i] ? prev.sets[i].value2 : '',
        done: prev && prev.sets[i] ? prev.sets[i].done : false
      }))
    };
  });
  view = 'workout';
  render();
  saveAll();
}

async function finishWorkout(){
  const entry = {
    date: todayStr(),
    type: activeType,
    exercises: draft.map(ex => ({
      name: ex.name,
      isTime: ex.isTime,
      sets: ex.sets.map(s => ({ value1: s.value1 || '0', value2: s.value2 || '0', done: s.done }))
    }))
  };
  sessions = sessions.filter(s => s.date !== entry.date);
  sessions.push(entry);
  sessions.sort((a,b) => a.date.localeCompare(b.date));
  activeType = null; draft = null; view = 'today';
  if (profile) program = buildProgram(profile);
  await saveAll();
  render();
}

function monthName(year, month){
  const d = new Date(year, month, 1);
  const s = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function daysInMonth(year, month){
  return new Date(year, month + 1, 0).getDate();
}
function monthGrid(year, month){
  const total = daysInMonth(year, month);
  const days = [];
  for (let day = 1; day <= total; day++){
    const ds = todayStr(new Date(year, month, day));
    const s = sessions.find(x => x.date === ds);
    days.push({ day, ds, letter: s ? s.type : null, isToday: ds === todayStr() });
  }
  return days;
}
function monthGridHtml(days){
  return days.map(d => `
    <div class="day-sq ${d.letter?'done':''} ${d.isToday?'today':''}" title="${d.ds}">${d.letter || d.day}</div>
  `).join('');
}
function pastMonths(){
  const now = new Date();
  const curKey = now.getFullYear() + '-' + now.getMonth();
  const seen = new Set();
  const months = [];
  sessions.forEach(s => {
    const d = new Date(s.date + 'T00:00:00');
    const key = d.getFullYear() + '-' + d.getMonth();
    if (key !== curKey && !seen.has(key)){
      seen.add(key);
      months.push({ year: d.getFullYear(), month: d.getMonth() });
    }
  });
  months.sort((a,b) => (b.year*12+b.month) - (a.year*12+a.month));
  return months;
}

function plural(n, forms){
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5) return forms[1];
  return b === 1 ? forms[0] : forms[2];
}
function workoutSummary(list){
  const setsTotal = list.reduce((sum, ex) => sum + ex.sets, 0);
  const minutes = Math.round((setsTotal * 2.5 + 8) / 5) * 5;
  return list.length + ' ' + plural(list.length, ['упражнение', 'упражнения', 'упражнений']) + ' · примерно ' + minutes + ' минут';
}

      <button class="row" onclick="startQuiz()">
        <span class="icon-sq" style="background:#0091FF">${icon('person')}</span>
        <span class="row-body"><span class="row-label">Пройти тест</span>${icon('chevron')}</span>
      </button>
    </div>
    <p class="lib-note">Тест не пройден — сейчас стандартная программа.</p>
  `;
  const accountGroup = session ? `
    <p class="section-title" style="margin-top:4px;">Аккаунт</p>
    <div class="card list">
      ${row('send', '#2AABEE', 'Telegram', escapeHtml(session.name || ''))}
      ${TG_INIT_DATA ? '' : `<button class="row" onclick="logout()"><span class="row-body"><span class="row-label" style="color:var(--red)">Выйти</span></span></button>`}
    </div>
  ` : '';
  return `
    ${accountGroup}
    <p class="section-title">Профиль</p>
    ${profileGroup}
    ${section('Тренировка A', program.A)}
    ${section('Тренировка B', program.B)}
    <p class="lib-note" style="margin-top:0;">Подходы и повторения можно настроить под себя. Изменения применяются со следующей тренировки.</p>
    <div class="card list">
      <button class="row" onclick="resetOverrides()"><span class="row-body"><span class="row-label" style="color:var(--red)">${overridesResetArmed ? 'Точно сбросить? Нажми ещё раз' : 'Сбросить к значениям по умолчанию'}</span></span></button>
    </div>
  `;
}

function renderHistory(){
  if (sessions.length === 0){
    return `<div class="card"><p class="empty">Пока нет записанных тренировок</p></div>`;
  }
  const monthCards = pastMonths().map(m => `
    <div class="card">
      <p class="eyebrow">${monthName(m.year, m.month)}</p>
      <div class="strip">${monthGridHtml(monthGrid(m.year, m.month))}</div>
    </div>
  `).join('');
  const items = [...sessions].reverse().map(s => {
    const exHtml = s.exercises.map(ex => {
      const sets = filledSets(ex);
      if (!sets.length) return '';
      const txt = sets.map(st => ex.isTime ? (st.value1+'сек') : (st.value1+'кг×'+st.value2)).join(', ');
      return `<div class="hist-ex"><b>${ex.name}</b><br><span class="sets-txt">${txt}</span></div>`;
    }).join('') || '<div class="hist-ex"><span class="sets-txt">Ничего не записано</span></div>';
    return `
      <details class="hist-item">
        <summary>
          <span>${formatDateRu(s.date)}</span>
          <span class="row-value">Тип ${s.type}${icon('chevron')}</span>
        </summary>
        <div class="hist-body">${exHtml}</div>
      </details>
    `;
  }).join('');
  return monthCards + `<p class="section-title">Тренировки</p><div class="card list">${items}</div>`;
}

function renderProgress(){
  const all = [...program.A, ...program.B].filter((ex, i, arr) => arr.findIndex(e => e.name === ex.name) === i);
  const rows = all.map(ex => {
    const perf = lastPerformance(ex.name);
    let val = '—';
    if (perf){
      const maxOf = field => Math.max(...perf.sets.map(s => Number(s[field]) || 0));
      const best = perf.isTime ? maxOf('value1') + ' сек'
        : maxOf('value1') > 0 ? kg(maxOf('value1')) + ' кг'
        : maxOf('value2') + ' повт.';
      val = best + ' · ' + new Date(perf.date+'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      const adv = weightAdvice(getConfig(ex), profile);
      if (adv && adv.trend) val += `<span class="next-load ${adv.trend}">дальше ${loadLabel(ex.name, adv.weight, true)} ${adv.trend === 'up' ? '↑' : '↓'}</span>`;
    }
    return `<div class="progress-row"><span class="pname">${ex.name}</span><span class="pval">${val}</span></div>`;
  }).join('');
  return `
    <p class="section-title" style="margin-top:4px;">Последний результат</p>
    <div class="card list">${rows}</div>
    <div class="card list">
      <button class="row" onclick="resetAll()"><span class="row-body"><span class="row-label" style="color:var(--red)">${resetArmed ? 'Точно удалить всё? Нажми ещё раз' : 'Сбросить все данные'}</span></span></button>
    </div>
  `;
}

function renderQuiz(){
  if (quiz.step === QUIZ.length) return renderQuizResult();
  const step = QUIZ[quiz.step];
  const a = quiz.answers;
  let body;
  if (step.id === 'body'){
    const fields = [['age', 'Возраст', 'лет', 'numeric'], ['height', 'Рост', 'см', 'numeric'], ['weight', 'Вес', 'кг', 'decimal']];
    body = `
      <p class="quiz-title">Расскажите о себе</p>
      <p class="quiz-sub">От этого зависят нагрузка, выбор упражнений и стартовые веса</p>
      <div class="segmented">
        ${Object.entries(SEX_LABELS).map(([v, label]) => `
          <button class="${a.sex === v ? 'on' : ''}" onclick="quizSex('${v}')">${label}</button>
        `).join('')}
      </div>
      <div class="card list">
        ${fields.map(([f, label, unit, mode]) => `
          <label class="row">
            <span class="row-body">
              <span class="row-label">${label}</span>
              <input type="number" inputmode="${mode}" placeholder="0" value="${a[f] ?? ''}" oninput="quizBody('${f}', this.value)">
              <span class="row-unit">${unit}</span>
            </span>
          </label>
        `).join('')}
      </div>
    `;
  } else {
    const options = step.multi ? [...step.options, [null, 'Нет, всё в порядке']] : step.options;
    const isOn = v => step.multi ? (v === null ? a.limits.length === 0 : a.limits.includes(v)) : a[step.id] === v;
    body = `
      <p class="quiz-title">${step.title}</p>
      <p class="quiz-sub">${step.subtitle || ''}</p>
      <div class="card list">
        ${options.map(([v, label, hint], i) => `
          <button class="row" onclick="quizChoose(${i})">
            <span class="row-body">
              <span class="row-text">
                <span class="row-label">${label}</span>
                ${hint ? `<span class="row-sub">${hint}</span>` : ''}
              </span>
              ${isOn(v) ? `<span class="check">${icon('check')}</span>` : ''}
            </span>
          </button>
        `).join('')}
      </div>
    `;
  }
  const back = quiz.step > 0 ? `<button class="btn btn-outline" onclick="quizGo(-1)">Назад</button>` : '';
  const next = (step.id === 'body' || step.multi) ? `<button class="btn btn-primary" onclick="quizNext()">Далее</button>` : '';
  return `
    <div class="quiz-top">
      <span class="quiz-step">Шаг ${quiz.step + 1} из ${QUIZ.length}</span>
      <button class="btn-ghost" onclick="quizExit()">Выйти</button>
    </div>
    <div class="quiz-bar"><span style="width:${(quiz.step + 1) / QUIZ.length * 100}%"></span></div>
    ${body}
    ${quiz.error ? `<p class="quiz-error">${quiz.error}</p>` : ''}
    <div class="row-2">${back}${next}</div>
  `;
}

function renderQuizResult(){
  const a = quiz.answers;
  const plan = buildProgram(a);
  const planGroup = type => `
    <p class="section-title">${TYPE_LABELS[type]}</p>
    <div class="card list">
      ${plan[type].map(ex => {
        const range = ex.repsMin === ex.repsMax ? ex.repsMin : ex.repsMin + '–' + ex.repsMax;
        const adv = weightAdvice(ex, a);
        const load = adv && adv.weight ? `<span class="plan-load">${loadLabel(ex.name, adv.weight, true)}</span>` : '';
        return `<div class="plan-row"><span>${ex.name}</span><span class="plan-sets">${ex.sets} × ${range}${ex.isTime ? ' сек' : ''}${load}</span></div>`;
      }).join('')}
    </div>
  `;
  const resetNote = Object.keys(overrides).length
    ? '<p class="lib-note" style="margin-top:0;">Ручные настройки подходов и повторений будут сброшены.</p>'
    : '';
  return `
    <div class="card">
      <p class="eyebrow">Программа готова</p>
      <p class="quiz-title">${optionLabel('goal', a.goal)}</p>
      <p class="quiz-sub" style="margin-bottom:0;">${optionLabel('level', a.level)} · ${optionLabel('place', a.place)} · ${bmiText(a)}</p>
      <ul class="notes">${planNotes(a).map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
    ${planGroup('A')}
    ${planGroup('B')}
    ${resetNote}
    <div class="row-2">
      <button class="btn btn-outline" onclick="quizGo(-1)">Изменить ответы</button>
      <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
    </div>
  `;
}

function renderLogin(){
  const bot = escapeHtml(botName);
  return `
    <p class="quiz-title">Вход через Telegram</p>
    <p class="quiz-sub">Дневник работает через Telegram-бота. Откройте его и нажмите «Старт» — бот пришлёт кнопку, чтобы открыть дневник прямо в Telegram, и код для входа здесь.</p>
    ${bot ? `<a class="btn btn-primary" href="https://t.me/${bot}" target="_blank" rel="noopener" style="text-decoration:none;">Открыть @${bot}</a>` : ''}
    <p class="section-title">Код из бота</p>
    <div class="card list">
      <label class="row">
        <span class="row-body">
          <span class="row-label">Код</span>
          <input type="text" id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" onkeydown="if (event.key === 'Enter') loginWithCode()">
        </span>
      </label>
    </div>
    ${loginError ? `<p class="quiz-error">${escapeHtml(loginError)}</p>` : ''}
    <button class="btn btn-outline" onclick="loginWithCode()">Войти</button>
  `;
}

function renderLoadError(){
  return `
    <div class="card">
      <p class="empty">Не удалось загрузить данные<br><span style="font-size:13px;">${escapeHtml(loadError)}</span></p>
      <button class="btn btn-primary" onclick="init()">Повторить</button>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if (view === 'loading'){
    app.innerHTML = renderHeader() + '<p class="empty">Загрузка…</p>';
    return;
  }
  const activeTab = view === 'workout' ? 'today' : view;
  const bare = view === 'quiz' || view === 'login' || view === 'error';
  let body = '';
  if (view === 'today') body = renderToday();
  else if (view === 'workout') body = renderWorkout();
  else if (view === 'exercises') body = renderExercises();
  else if (view === 'settings') body = renderSettings();
  else if (view === 'history') body = renderHistory();
  else if (view === 'progress') body = renderProgress();
  else if (view === 'quiz') body = renderQuiz();
  else if (view === 'login') body = renderLogin();
  else if (view === 'error') body = renderLoadError();
  const banner = saveFailed ? `
    <div class="banner">
      <span>Не удалось сохранить изменения</span>
      <button onclick="saveAll()">Повторить</button>
    </div>
  ` : '';
  app.innerHTML = renderHeader() + (bare ? '' : renderTabBar(activeTab)) + banner + body;
}

async function init(){
  view = 'loading';
  render();
  if (TG_INIT_DATA){
    try { storeSession(await authRequest({ initData: TG_INIT_DATA })); }
    catch (e) { loginError = e.message; }
  }
  if (!session){
    showLogin();
    return;
  }
  const data = await loadAll();
  if (data.status === 'login'){
    storeSession(null);
    showLogin();
    return;
  }
  if (data.status === 'error'){
    loadError = data.message || '';
    view = 'error';
    render();
    return;
  }
  loginError = '';
  sessions = data.sessions;
  overrides = data.overrides;
  profile = data.profile;
  program = profile ? buildProgram(profile) : DEFAULT_PROGRAM;
  const saved = data.draft;
  if (saved && program[saved.type] && Array.isArray(saved.exercises)){
    activeType = saved.type;
    draft = saved.exercises;
    view = 'workout';
  } else {
    activeType = null;
    draft = null;
    view = 'today';
  }
  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && activeType) saveAll();
});
setupTelegram();
init();
</script>
</body>
</html>
