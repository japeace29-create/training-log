function renderWorkout(){
  if (orderMode) return renderOrder();
  const exercisesHtml = draft.map((ex, exIdx) => {
    const perf = lastPerformance(ex.name, todayStr());
    const prevNote = lastNote(ex.name, draftDate || todayStr());
    const record = exerciseRecord(ex.name, todayStr());
    // Рекордным считаем только отмеченный подход: пока цифра не подтверждена,
    // это ещё не результат.
    const beats = ex.sets.map(s => record && s.done && !s.warmup && !s.drop && setScore(ex.isTime, s) > record.score);
    const bestNow = ex.sets.reduce((acc, s, i) => (
      beats[i] && (!acc || setScore(ex.isTime, s) > setScore(ex.isTime, acc)) ? s : acc
    ), null);
    const adv = ex.advice;
    const adviceHtml = !adv ? '' : `
      <p class="advice">
        ${adv.weight ? `Рекомендуемый вес: <b>${loadLabel(ex.name, adv.weight)}${adv.trend === 'up' ? ' ↑' : adv.trend === 'down' ? ' ↓' : ''}</b><br>` : ''}${adv.text}
      </p>
    `;
    let working = 0;
    let shownWeight = null;
    const barbell = LOADS[ex.name] && LOADS[ex.name].eq === 'barbell';
    const platesLine = value => {
      // Показываем раскладку один раз на каждый новый вес в упражнении.
      if (!barbell || !value || value === shownWeight) return '';
      shownWeight = value;
      const plates = platesFor(Number(value));
      if (!plates) return '';
      return `<p class="plates">${kg(value)} кг — на сторону ${plates.text}${
        plates.exact ? '' : ' (выйдет ' + kg(plates.real) + ')'}</p>`;
    };
    const setsHtml = ex.sets.map((s, setIdx) => {
      // Разминка и дропсет не нумеруются: рабочие подходы считаются отдельно.
      const label = s.drop ? 'Д' : s.warmup ? 'Р' : String(++working);
      const tag = s.drop
        ? `<button class="set-label drop" onclick="removeSet(${exIdx},${setIdx})" title="Дропсет — нажмите, чтобы убрать">Д</button>`
        : `<button class="set-label${s.warmup ? ' warm' : ''}" onclick="toggleWarmup(${exIdx},${setIdx})" title="Разминочный подход">${label}</button>`;
      if (ex.isTime){
        return `
          <div class="set-row${beats[setIdx] ? ' record' : ''}${s.warmup ? ' warmup' : ''}">
            ${tag}
            <input type="number" inputmode="numeric" placeholder="0" value="${s.value1}" class="${isAuto(s) ? 'auto' : ''}"
              oninput="setVal(${exIdx},${setIdx},'value1',this.value)">
            <span class="unit">сек</span>
            <button class="done-toggle ${s.done?'on':''}" onclick="toggleDone(${exIdx},${setIdx})">${s.done?'✓':''}</button>
          </div>
        `;
      }
      return `
        <div class="set-row${beats[setIdx] ? ' record' : ''}${s.warmup ? ' warmup' : ''}${s.drop ? ' drop' : ''}">
          ${tag}
          <input type="number" inputmode="decimal" placeholder="кг" value="${s.value1}"
            oninput="setVal(${exIdx},${setIdx},'value1',this.value)">
          <span class="unit">кг</span>
          <input type="number" inputmode="numeric" placeholder="повт." value="${s.value2}" class="${isAuto(s) ? 'auto' : ''}"
            oninput="setVal(${exIdx},${setIdx},'value2',this.value)">
          <button class="done-toggle ${s.done?'on':''}" onclick="toggleDone(${exIdx},${setIdx})">${s.done?'✓':''}</button>
        </div>
        ${platesLine(s.value1)}
      `;
    }).join('');
    // Дропсет предлагаем не всем и не всегда, а там, где вес действительно
    // встал: программа советует тот же вес, и он не растёт третью тренировку.
    const stuck = adv && adv.weight && !adv.trend && stalledWeight(ex.name);
    const dropHint = canDrop(ex) && !ex.sets.some(s => s.drop) && stuck
      ? `<p class="adv-hint">Вес не растёт третью тренировку. <b>Дропсет</b> на последнем подходе даст мышце больше работы без прибавки веса — кнопка ниже.</p>`
      : '';
    const card = `
      <div class="exercise">
        <div class="ex-head">
          <div>
            <h3>${ex.name}</h3>
            <p class="target">${ex.target}</p>
          </div>
          <div class="ex-actions">
            ${ex.slot != null && !ex.custom ? `<button class="video-btn" onclick="toggleSwap('${activeType}:${ex.slot}')">${icon('stairs')}Заменить</button>` : ''}
            <button class="video-btn" onclick="toggleHowto('${ex.name.replace(/'/g, "\\'")}')">${icon('aid')}Как делать</button>
          </div>
        </div>
        ${howtoCard(ex.name)}
        ${ex.slot != null && !ex.custom ? swapList(activeType, ex.slot, ex.name, true) : ''}
        ${ex.planned ? `<p class="swap-note" style="margin:0 0 6px;">Замена на сегодня · по программе: ${escapeHtml(ex.planned)}</p>` : ''}
        ${ex.extra ? `<p class="swap-note" style="margin:0 0 6px;">Добавлено на сегодня</p>` : ''}
        <p class="last-time">${hintText(perf)}</p>
        ${prevNote ? `<p class="prev-note">💬 ${dayText(prevNote.date, true)}: ${escapeHtml(prevNote.note)}</p>` : ''}
        ${adviceHtml}
        ${dropHint}
        ${setsHtml}
        <div class="set-extras">
          <button class="add-warmup" onclick="addWarmup(${exIdx})">+ разминочный подход</button>
          ${canDrop(ex) ? `<button class="add-warmup" onclick="addDrop(${exIdx})">+ дропсет</button>` : ''}
          ${canPair(exIdx) ? `<button class="add-warmup" onclick="togglePair(${exIdx})">${
            pairedNext(exIdx) ? '✕ разъединить пару' : '⇄ в паре со следующим'}</button>` : ''}
        </div>
        ${bestNow ? `<p class="record-line">🏆 Новый рекорд: ${setLabel(ex.isTime, bestNow)} — было ${record.label}</p>` : ''}
        <textarea class="note-input autogrow" rows="1" maxlength="200" placeholder="Заметка к упражнению"
          oninput="setExerciseNote(${exIdx}, this.value); autoGrow(this)">${escapeHtml(ex.note || '')}</textarea>
      </div>
    `;
    // Пара оборачивается общей скобкой: отдых у неё один, и это видно.
    return (pairedNext(exIdx)
        ? `<div class="superset"><p class="superset-tag">⇄ Суперсет — по очереди, отдых после пары</p>`
        : '')
      + card
      + (pairedPrev(exIdx) ? `</div>` : '');
  }).join('');
  const pairHint = draft.some((e, i) => canPair(i)) && !draft.some((e, i) => pairedNext(i))
    ? `<p class="adv-hint" style="margin:8px 0 16px;">Мало времени? Кнопка <b>«в паре со следующим»</b> под подходами соединит два упражнения в суперсет: делаете их по очереди, отдых один — после пары.</p>`
    : '';

  const autoHint = !autoSeen && draft.some(e => e.sets.some(isAuto))
    ? `<p class="adv-hint" style="margin:8px 0 16px;">Серые цифры — как в прошлый раз. Сделали так же — нажмите галочку, иначе впишите своё. Серые подходы без галочки в дневник не попадут.</p>`
    : '';
  return `
    <div class="card">
      <div class="wo-head">
        <p class="eyebrow">${TYPE_LABELS[activeType]}${draftDate ? ' · ' + dayText(draftDate) : ''}</p>
        <button class="wo-edit" onclick="openOrder()">Порядок и состав</button>
      </div>
      ${draftDeload ? `<p class="swap-note" style="margin:0 0 10px;">Разгрузочная неделя: вес ${Math.round(DELOAD_LOAD * 100)}% от обычного, подходов на один меньше, без отказа.</p>` : ''}
      ${autoHint}
      ${pairHint}
      ${exercisesHtml}
    </div>
    <div class="card">
      <p class="eyebrow">Как прошла тренировка</p>
      <textarea class="note-input autogrow" rows="2" maxlength="500" placeholder="Самочувствие, что мешало, что получилось"
        oninput="setWorkoutNote(this.value); autoGrow(this)">${escapeHtml(draftNote)}</textarea>
    </div>
    <div class="row-2">
      <button class="btn btn-outline narrow" onclick="cancelWorkout()">Отмена</button>
      <button class="btn btn-primary" onclick="finishWorkout()">${draftDate ? 'Сохранить' : 'Завершить тренировку'}</button>
    </div>
  `;
}

function renderHistory(){
  if (sessions.length === 0){
    return `<div class="card"><p class="empty">Пока нет записанных тренировок</p></div>`;
  }
  const monthCards = pastMonths().map(m => `
    <div class="card">
      <p class="eyebrow">${monthName(m.year, m.month)}</p>
      <div class="strip">${monthGridHtml(monthGrid(m.year, m.month))}</div>
    </div>
  `).join('');
  const items = [...sessions].reverse().map(s => {
    const exHtml = s.exercises.map(ex => {
      const sets = countedSets(ex);
      if (!sets.length) return '';
      const txt = sets.map(st => (st.drop ? 'дроп ' : '')
        + (ex.isTime ? (st.value1 + 'сек') : (kgText(st.value1) + 'кг×' + st.value2))).join(', ');
      return `<div class="hist-ex"><b>${ex.name}</b><br><span class="sets-txt">${txt}</span>${
        ex.note ? `<br><span class="hist-note">💬 ${escapeHtml(ex.note)}</span>` : ''}</div>`;
    }).join('') || '<div class="hist-ex"><span class="sets-txt">Ничего не записано</span></div>';
    return `
      <details class="hist-item">
        <summary>
          <span>${formatDateRu(s.date)}</span>
          <span class="row-value">Тип ${s.type}${s.deload ? ' · разгрузка' : ''}${icon('chevron')}</span>
        </summary>
        <div class="hist-body">
          ${s.note ? `<p class="hist-note top">💬 ${escapeHtml(s.note)}</p>` : ''}
          ${exHtml}
          <div class="hist-actions">
            <button class="btn btn-outline" onclick="editSession('${s.date}')">Изменить</button>
            <button class="btn btn-outline danger" onclick="deleteSession('${s.date}')">${deleteArmed === s.date ? 'Точно удалить?' : 'Удалить'}</button>
          </div>
        </div>
      </details>
    `;
  }).join('');
  return monthCards + `<p class="section-title">Тренировки</p><div class="card list">${items}</div>`;
}

function renderProgress(){
  const all = activeDays().flatMap(type => program[type] || [])
    .filter((ex, i, arr) => arr.findIndex(e => e.name === ex.name) === i);
  const rows = all.map(ex => {
    const perf = lastPerformance(ex.name);
    let val = '—';
    if (perf){
      const maxOf = field => Math.max(...perf.sets.map(s => Number(s[field]) || 0));
      const best = perf.isTime ? maxOf('value1') + ' сек'
        : maxOf('value1') > 0 ? kg(maxOf('value1')) + ' кг'
        : maxOf('value2') + ' повт.';
      val = best + ' · ' + new Date(perf.date+'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      const adv = weightAdvice(getConfig(ex), profile);
      if (adv && adv.trend) val += `<span class="next-load ${adv.trend}">дальше ${loadLabel(ex.name, adv.weight, true)} ${adv.trend === 'up' ? '↑' : '↓'}</span>`;
    }
    const series = exerciseSeries(ex.name);
    const open = progressOpen === ex.name;
    const unit = series.length ? series[series.length - 1].unit : 'кг';
    const fmt = v => (unit === 'кг' ? kgText(v) : String(v)) + ' ' + unit;
    const best = series.length ? Math.max(...series.map(p => p.value)) : 0;
    const bestAt = series.length ? series.map(p => p.value).lastIndexOf(best) : -1;
    const bestIsLast = bestAt === series.length - 1;
    const rec = exerciseRecord(ex.name);
    const recordText = (rec ? `🏆 Рекорд — ${rec.label}, ${dayText(rec.date)}. ` : '')
      + (bestIsLast ? 'Последняя тренировка — лучшая.' : 'Зелёная точка — лучший рабочий вес.');
    // Формула Эпли уже посчитана для рекорда — остаётся показать её человеку.
    const rmText = open && rec && unit === 'кг' && rec.score > 0
      ? `<p class="swap-note" style="margin:6px 0 0;">Расчётный максимум на один раз — около ${kgText(Math.round(rec.score * 2) / 2)} кг. Это оценка по лучшему подходу, проверять её в зале не нужно.</p>`
      : '';
    const chart = !open ? '' : series.length < 3
      ? `<p class="swap-note">Нужно хотя бы три тренировки с этим упражнением — пока их ${series.length}.</p>`
      : `
        <div class="ex-chart">
          ${lineChart('ex', series, (v, short) => short ? (unit === 'кг' ? kgText(v) : String(v)) : fmt(v), true)}
          <p class="weight-caption" id="cap-ex">${dayText(series[series.length - 1].date)} — ${fmt(series[series.length - 1].value)}</p>
          <p class="swap-note" style="margin:0;">${recordText}</p>
        </div>
      `;
    return `
      <div class="progress-item">
        <button class="progress-row ${open ? 'open' : ''}" onclick="toggleExerciseChart('${ex.name.replace(/'/g, "\\'")}')">
          <span class="pname">${ex.name}</span><span class="pval">${val}</span>
        </button>
        ${chart}
        ${rmText}
      </div>
    `;
  }).join('');
  const volumes = volumeSeries();
  const lastVolume = volumes.length ? volumes[volumes.length - 1] : null;
  const monthAgo = todayStr(new Date(Date.now() - 30 * 86400000));
  const monthTotal = volumes.filter(v => v.date > monthAgo).reduce((sum, v) => sum + v.value, 0);
  const volumeCard = volumes.length < 3 ? '' : `
    <p class="section-title">Объём</p>
    <div class="card">
      <div class="weight-head">
        <span class="weight-now">${volumeText(monthTotal)}</span>
        <span class="weight-delta">поднято за 30 дней</span>
      </div>
      ${lineChart('volume', volumes, (v, short) => volumeText(v, short))}
      <p class="weight-caption" id="cap-volume" style="margin-bottom:0;">${dayText(lastVolume.date)} — ${volumeText(lastVolume.value)}</p>
    </div>
    <p class="lib-note">Объём — вес, умноженный на повторения, по всем подходам тренировки. Упражнения без веса в него не попадают.</p>
  `;
  const w = weightStats();
  const deltaText = !w ? '' : w.delta === 0
    ? 'без изменений'
    : (w.delta > 0 ? '+' : '−') + kgText(Math.abs(w.delta)) + ' кг ' + (w.sinceMonth ? 'за 30 дней' : 'с первой записи');
  const table = weights.length > 1 ? `
    <details class="weight-table">
      <summary>Все записи (${weights.length})</summary>
      ${[...weights].reverse().map(item => `
        <div class="weight-row"><span>${dayText(item.date)}</span><span>${kgText(item.kg)} кг</span></div>
      `).join('')}
    </details>
  ` : '';
  const weightCard = `
    <p class="section-title" style="margin-top:4px;">Вес</p>
    <div class="card">
      ${w ? `
        <div class="weight-head">
          <span class="weight-now">${kgText(w.last.kg)}<span class="weight-unit">кг</span></span>
          <span class="weight-delta">${deltaText}</span>
        </div>
      ` : '<p class="empty" style="margin:0 0 12px;">Запишите вес, чтобы видеть, как он меняется</p>'}
      ${lineChart('weight', weights.map(item => ({ date: item.date, value: item.kg })), v => kgText(v) + ' кг')}
      ${w ? `<p class="weight-caption" id="cap-weight">${dayText(w.last.date)} — ${kgText(w.last.kg)} кг</p>` : ''}
      <div class="weight-form">
        <input type="text" id="weight-input" inputmode="decimal" maxlength="5" placeholder="${w ? kgText(w.last.kg) : 'кг'}"
          onkeydown="if (event.key === 'Enter') logWeight()">
        <button class="btn btn-outline" onclick="logWeight()">Записать</button>
      </div>
      ${weightError ? `<p class="quiz-error" style="margin-bottom:0;">${weightError}</p>` : ''}
      ${table}
    </div>
    <p class="lib-note">От веса тела считаются рекомендуемые веса в упражнениях — записывайте его хотя бы раз в неделю.</p>
  `;
  const gl = groupLoad(28);
  const maxSets = Math.max(1, ...gl.rows.map(r => r.sets));
  const empty = gl.rows.filter(r => !r.sets).map(r => r.group);
  const lightest = [...gl.rows].sort((a, b) => a.sets - b.sets)[0];
  const perWeek = n => String(Math.round(n / gl.weeks * 10) / 10).replace('.', ',');
  const groupCard = `
    <p class="section-title">Мышцы за 4 недели</p>
    <div class="card">
      ${gl.total ? `
        <div class="group-chart">
          ${gl.rows.map(r => `
            <div class="group-row">
              <span class="group-name">${r.group}</span>
              <span class="group-bar"><span style="width:${Math.round(r.sets / maxSets * 100)}%"></span></span>
              <span class="group-val">${r.sets}</span>
            </div>
          `).join('')}
        </div>
        <p class="swap-note" style="margin:12px 0 0;">Рабочих подходов за 28 дней${
          gl.other ? ' (ещё ' + gl.other + ' без группы)' : ''}. ${empty.length
            ? 'Совсем без нагрузки: ' + empty.join(', ') + '.'
            : 'Меньше всего досталось группе «' + lightest.group + '» — ' + perWeek(lightest.sets) + ' подхода в неделю.'}</p>
      ` : '<p class="empty" style="margin:0;">За последний месяц записанных подходов нет</p>'}
    </div>
    <p class="lib-note">Считаем подходами, а не килограммами: в килограммах ноги выигрывают всегда, и по ним не видно, что спину пропустили. Разминка и дропсеты в счёт не идут.</p>
  `;
  return `
    ${weightCard}
    ${volumeCard}
    ${groupCard}
    <p class="section-title">Упражнения</p>
    <div class="card list">${rows}</div>
    <p class="lib-note">Нажмите на упражнение — покажу, как менялся рабочий вес.</p>
    <div class="card list">
      <button class="row" onclick="resetAll()"><span class="row-body"><span class="row-label" style="color:var(--red)">${resetArmed ? 'Точно удалить всё? Нажми ещё раз' : 'Сбросить все данные'}</span></span></button>
    </div>
  `;
}

function renderQuiz(){
  if (quiz.step === QUIZ.length) return renderQuizResult();
  const step = QUIZ[quiz.step];
  const a = quiz.answers;
  let body;
  if (step.id === 'body'){
    const fields = [['age', 'Возраст', 'лет', 'numeric'], ['height', 'Рост', 'см', 'numeric'], ['weight', 'Вес', 'кг', 'decimal']];
    body = `
      <p class="quiz-title">Расскажите о себе</p>
      <p class="quiz-sub">От этого зависят нагрузка, выбор упражнений и стартовые веса</p>
      <div class="segmented">
        ${Object.entries(SEX_LABELS).map(([v, label]) => `
          <button class="${a.sex === v ? 'on' : ''}" onclick="quizSex('${v}')">${label}</button>
        `).join('')}
      </div>
      <div class="card list">
        ${fields.map(([f, label, unit, mode]) => `
          <label class="row">
            <span class="row-body">
              <span class="row-label">${label}</span>
              <input type="number" inputmode="${mode}" placeholder="0" value="${a[f] ?? ''}" oninput="quizBody('${f}', this.value)">
              <span class="row-unit">${unit}</span>
            </span>
          </label>
        `).join('')}
      </div>
    `;
  } else if (step.id === 'reminders'){
    body = `
      <p class="quiz-title">Напоминать о тренировках?</p>
      <p class="quiz-sub">Бот напишет в Telegram в выбранные дни. Это можно изменить в настройках в любой момент</p>
      ${reminderCard(quiz.reminders, {
        toggle: 'quizToggleReminders()',
        day: day => `quizToggleReminderDay(${day})`,
        time: 'quizReminderTime(this.value)'
      })}
      <p class="lib-note">${quiz.reminders.enabled
        ? 'Если вы уже потренировались в этот день, напоминание не придёт.'
        : 'Без напоминаний — вы сами решаете, когда тренироваться.'}</p>
      <div class="card list">
        <button class="row" onclick="quizToggleWeigh()">
          <span class="icon-sq" style="background:#6D7CFF">${icon('ruler')}</span>
          <span class="row-body">
            <span class="row-label">Напомнить встать на весы</span>
            <span class="switch ${Number.isInteger(quiz.reminders.weighDay) ? 'on' : ''}"></span>
          </span>
        </button>
      </div>
      <p class="lib-note">${Number.isInteger(quiz.reminders.weighDay)
        ? 'Раз в неделю, по понедельникам утром. День и время меняются в настройках.'
        : 'От веса тела считаются рекомендуемые веса в упражнениях.'}</p>
    `;
  } else {
    const options = step.multi ? [...step.options, [null, 'Нет, всё в порядке']] : step.options;
    const isOn = v => step.multi ? (v === null ? a.limits.length === 0 : a.limits.includes(v)) : a[step.id] === v;
    body = `
      <p class="quiz-title">${step.title}</p>
      <p class="quiz-sub">${step.subtitle || ''}</p>
      <div class="card list">
        ${options.map(([v, label, hint], i) => `
          <button class="row" onclick="quizChoose(${i})">
            <span class="row-body">
              <span class="row-text">
                <span class="row-label">${label}</span>
                ${hint ? `<span class="row-sub">${hint}</span>` : ''}
              </span>
              ${isOn(v) ? `<span class="check">${icon('check')}</span>` : ''}
            </span>
          </button>
        `).join('')}
      </div>
    `;
  }
  const back = quiz.step > 0 ? `<button class="btn btn-outline" onclick="quizGo(-1)">Назад</button>` : '';
  const next = (step.id === 'body' || step.id === 'reminders' || step.multi)
    ? `<button class="btn btn-primary" onclick="quizNext()">Далее</button>` : '';
  return `
    <div class="quiz-top">
      <span class="quiz-step">Шаг ${quiz.step + 1} из ${QUIZ.length}</span>
      <button class="btn-ghost" onclick="quizExit()">Выйти</button>
    </div>
    <div class="quiz-bar"><span style="width:${(quiz.step + 1) / QUIZ.length * 100}%"></span></div>
    ${body}
    ${quiz.error ? `<p class="quiz-error">${quiz.error}</p>` : ''}
    <div class="row-2">${back}${next}</div>
  `;
}

function renderQuizResult(){
  const a = quiz.answers;
  const plan = buildProgram(a);
  const planGroup = type => `
    <p class="section-title">${TYPE_LABELS[type]}</p>
    <div class="card list">
      ${plan[type].map(ex => {
        const range = ex.repsMin === ex.repsMax ? ex.repsMin : ex.repsMin + '–' + ex.repsMax;
        const adv = weightAdvice(ex, a);
        const load = adv && adv.weight ? `<span class="plan-load">${loadLabel(ex.name, adv.weight, true)}</span>` : '';
        return `<div class="plan-row"><span>${ex.name}</span><span class="plan-sets">${ex.sets} × ${range}${ex.isTime ? ' сек' : ''}${load}</span></div>`;
      }).join('')}
    </div>
  `;
  const resetNote = Object.keys(overrides).length
    ? '<p class="lib-note" style="margin-top:0;">Ручные настройки подходов и повторений будут сброшены.</p>'
    : '';
  return `
    <div class="card">
      <p class="eyebrow">Программа готова</p>
      <p class="quiz-title">${optionLabel('goal', a.goal)}</p>
      <p class="quiz-sub" style="margin-bottom:0;">${optionLabel('level', a.level)} · ${optionLabel('place', a.place)} · ${bmiText(a)}</p>
      <ul class="notes">${planNotes(a).map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
    ${activeDays().map(planGroup).join('')}
    <p class="lib-note" style="margin-top:14px;">${remindersSummary(quiz.reminders)}</p>
    ${resetNote}
    <div class="row-2">
      <button class="btn btn-outline" onclick="quizGo(-1)">Изменить ответы</button>
      <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
    </div>
  `;
}

function renderLogin(){
  const bot = escapeHtml(botName);
  return `
    <p class="quiz-title">Вход через Telegram</p>
    <p class="quiz-sub">Дневник работает через Telegram-бота. Откройте его и нажмите «Старт» — бот пришлёт кнопку, чтобы открыть дневник прямо в Telegram, и код для входа здесь.</p>
    ${bot ? `<a class="btn btn-primary" href="https://t.me/${bot}" target="_blank" rel="noopener" style="text-decoration:none;">Открыть @${bot}</a>` : ''}
    <p class="section-title">Код из бота</p>
    <div class="card list">
      <label class="row">
        <span class="row-body">
          <span class="row-label">Код</span>
          <input type="text" id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" onkeydown="if (event.key === 'Enter') loginWithCode()">
        </span>
      </label>
    </div>
    ${loginError ? `<p class="quiz-error">${escapeHtml(loginError)}</p>` : ''}
    <button class="btn btn-outline" onclick="loginWithCode()">Войти</button>
  `;
}

function renderLoadError(){
  return `
    <div class="card">
      <p class="empty">Не удалось загрузить данные<br><span style="font-size:13px;">${escapeHtml(loadError)}</span></p>
      <button class="btn btn-primary" onclick="init()">Повторить</button>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if (view === 'loading'){
    app.innerHTML = renderHeader() + '<p class="empty">Загрузка…</p>';
    return;
  }
  const activeTab = view === 'workout' ? 'today' : view;
  const bare = view === 'quiz' || view === 'login' || view === 'error';
  let body = '';
  if (view === 'today') body = renderToday();
  else if (view === 'workout') body = renderWorkout();
  else if (view === 'exercises') body = renderExercises();
  else if (view === 'settings') body = renderSettings();
  else if (view === 'history') body = renderHistory();
  else if (view === 'progress') body = renderProgress();
  else if (view === 'quiz') body = renderQuiz();
  else if (view === 'login') body = renderLogin();
  else if (view === 'error') body = renderLoadError();
  const banner = pendingSave ? `
    <div class="banner">
      <span>Записано на телефоне. Отправим на сервер, когда появится связь.</span>
      <button onclick="saveAll()">Повторить</button>
    </div>
  ` : offline ? `
    <div class="banner">
      <span>Нет связи — показаны данные с телефона.</span>
      <button onclick="init()">Обновить</button>
    </div>
  ` : '';
  const restBar = rest ? `
    <div class="rest-bar${rest.done ? ' done' : ''}" id="rest-bar">
      <span class="rest-left">${rest.done ? 'Отдых окончен' : restClock(restLeft())}</span>
      <button onclick="skipRest()">${rest.done ? 'Убрать' : 'Пропустить'}</button>
    </div>
  ` : '';
  app.innerHTML = renderHeader() + (bare ? '' : renderTabBar(activeTab)) + banner + body + restBar;
  document.body.classList.toggle('resting', !!rest);
  document.querySelectorAll('.autogrow').forEach(autoGrow);
}

async function init(){
  view = 'loading';
  render();
  if (TG_INIT_DATA){
    try { storeSession(await authRequest({ initData: TG_INIT_DATA })); }
    catch (e) { loginError = e.message; }
  } else if (LOGIN_TOKEN){
    try { storeSession(await authRequest({ link: LOGIN_TOKEN })); }
    catch (e) { loginError = e.message; }
    stripLoginParam();   // ключ не должен оставаться в адресной строке
  }
  if (!session){
    showLogin();
    return;
  }
  // Пока идёт запрос к серверу, человек уже видит свои данные.
  const cached = readCache();
  if (cached){
    applyData(cached);
    render();
  }
  const data = await loadAll();
  if (data.status === 'login'){
    dropCache();
    storeSession(null);
    showLogin();
    return;
  }
  if (data.status === 'error'){
    if (cached){
      offline = true;
      pendingSave = pendingSave || !!cached.pending;
      render();
      return;
    }
    loadError = data.message || '';
    view = 'error';
    render();
    return;
  }
  loginError = '';
  offline = false;
  if (cached && cached.pending){
    // Что-то записали без сети — досылаем и объединяем с серверным.
    applyData(mergeData(cached, data));
    render();
    saveAll();
    return;
  }
  applyData(data);
  writeCache(false);
  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && activeType) saveAll();
  if (document.visibilityState === 'visible' && pendingSave) saveAll();
});
window.addEventListener('online', () => {
  if (pendingSave) saveAll();
  else if (offline) init();
});
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
setupTelegram();
init();
</script>
</body>
