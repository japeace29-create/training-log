<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Дневник тренировок</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0B0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --glass: rgba(22,17,26,0.44);
    --glass-strong: rgba(22,17,26,0.6);
    --glass-soft: rgba(255,255,255,0.1);
    --glass-border: rgba(255,255,255,0.3);
    --text:#FFFFFF;
    --text-muted: rgba(255,255,255,0.7);
    --accent:#E63946;
    --accent-2:#FF6B5B;
    --success:#34D399;
    --success-text:#04160F;
    --radius-s:14px;
    --radius-l:26px;
    --font-display:-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Quicksand', sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Nunito', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#121116;
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  .bg-scene{
    position:fixed;
    inset:0;
    z-index:0;
    width:100%;
    height:100%;
  }
  .bg-scene svg{
    width:100%;
    height:100%;
    display:block;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:480px;
    margin:0 auto;
    padding:22px 18px 40px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding:14px 18px;
    background:var(--glass);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:22px;
    box-shadow:0 8px 26px rgba(0,0,0,0.25);
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    margin:0;
    color:var(--text);
    text-shadow:0 1px 3px rgba(0,0,0,0.3);
  }
  header .date{
    font-size:12px;
    color:var(--text-muted);
    text-transform:capitalize;
    white-space:nowrap;
  }
  .card{
    background:var(--glass);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-l);
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 10px 34px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:46%;
    background:linear-gradient(to bottom, rgba(255,255,255,0.16), rgba(255,255,255,0));
    pointer-events:none;
  }
  .card.accent-edge{
    border-left:3px solid var(--accent);
  }
  .eyebrow{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 4px;
    position:relative;
  }
  .hero-type{
    font-family:var(--font-display);
    font-size:32px;
    font-weight:700;
    margin:0 0 6px;
    position:relative;
    text-shadow:0 1px 3px rgba(0,0,0,0.25);
  }
  .exercise-preview{
    font-size:13px;
    color:var(--text-muted);
    margin:10px 0 16px;
    position:relative;
  }
  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    padding:14px 16px;
    border-radius:18px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    border:1px solid transparent;
    cursor:pointer;
    position:relative;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    box-shadow:0 8px 20px rgba(255,92,138,0.4);
  }
  .btn-outline{
    background:var(--glass-soft);
    backdrop-filter:blur(10px);
    color:var(--text);
    border-color:var(--glass-border);
  }
  .btn-ghost{
    background:transparent;
    color:var(--text-muted);
    border:none;
    padding:8px 0;
    width:auto;
    font-size:13px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .row-2{
    display:flex;
    gap:10px;
  }
  .row-2 .btn{flex:1;}
  .stats{
    display:flex;
    gap:14px;
    margin-top:16px;
    position:relative;
  }
  .stat{flex:1;}
  .stat .num{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .stat .lbl{
    font-size:12px;
    color:var(--text-muted);
  }
  .strip{
    display:flex;
    gap:5px;
    margin-top:14px;
    flex-wrap:wrap;
    position:relative;
  }
  .day-sq{
    width:26px;
    height:26px;
    border-radius:8px;
    background:var(--glass-soft);
    border:1px solid var(--glass-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
    color:var(--text-muted);
  }
  .day-sq.done{
    background:var(--success);
    color:var(--success-text);
    border-color:var(--success);
  }
  .day-sq.today{
    box-shadow:0 0 0 2px var(--accent);
  }
  .exercise{
    margin-bottom:22px;
    position:relative;
  }
  .exercise:last-child{margin-bottom:0;}
  .exercise h3{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:700;
    margin:0 0 2px;
  }
  .exercise .target{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 4px;
  }
  .exercise .last-time{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 10px;
  }
  .ex-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .video-btn{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--font-body);
    font-size:12px;
    font-weight:700;
    color:var(--text);
    background:var(--glass-soft);
    border:1px solid var(--glass-border);
    border-radius:14px;
    padding:7px 10px;
    text-decoration:none;
    white-space:nowrap;
  }
  .video-btn:hover,
  .video-btn:focus-visible{
    border-color:var(--accent);
    color:var(--accent-2);
  }
  .lib-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,0.14);
    position:relative;
  }
  .lib-row:last-child{
    border-bottom:none;
    padding-bottom:0;
  }
  .lib-row:first-child{
    padding-top:0;
  }
  .lib-name{
    font-size:14px;
    font-weight:700;
    margin-bottom:2px;
  }
  .lib-note{
    font-size:12px;
    color:var(--text-muted);
    margin:-4px 0 16px;
  }
  .cfg-row{
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,0.14);
    position:relative;
  }
  .cfg-row:last-child{
    border-bottom:none;
    padding-bottom:0;
  }
  .cfg-row:first-child{
    padding-top:0;
  }
  .cfg-name{
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
  }
  .cfg-inputs{
    display:flex;
    gap:10px;
  }
  .cfg-inputs label{
    flex:1;
    font-size:11px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .cfg-inputs input{
    background:var(--glass-soft);
    border:1px solid var(--glass-border);
    color:var(--text);
    border-radius:12px;
    padding:8px;
    font-family:var(--font-body);
    font-size:14px;
    font-variant-numeric:tabular-nums;
    width:100%;
  }
  .cfg-inputs input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .set-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
    position:relative;
  }
  .set-row .set-label{
    width:20px;
    font-size:12px;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .set-row input{
    background:var(--glass-soft);
    border:1px solid var(--glass-border);
    color:var(--text);
    border-radius:12px;
    padding:9px 8px;
    font-family:var(--font-body);
    font-size:14px;
    font-variant-numeric:tabular-nums;
    width:100%;
  }
  .set-row input::placeholder{color:rgba(255,255,255,0.4);}
  .set-row input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .set-row .unit{
    font-size:12px;
    color:var(--text-muted);
    width:22px;
  }
  .set-row .done-toggle{
    flex:0 0 auto;
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid var(--glass-border);
    background:var(--glass-soft);
    color:var(--text-muted);
    cursor:pointer;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .set-row .done-toggle.on{
    background:var(--success);
    border-color:var(--success);
    color:var(--success-text);
  }
  .hist-item{
    border:1px solid var(--glass-border);
    background:var(--glass-soft);
    border-radius:16px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .hist-item summary{
    padding:12px 14px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    list-style:none;
  }
  .hist-item summary::-webkit-details-marker{display:none;}
  .hist-item summary .type-badge{
    font-family:var(--font-display);
    font-size:13px;
    font-weight:700;
    color:var(--accent-2);
  }
  .hist-body{
    padding:0 14px 14px;
    border-top:1px solid rgba(255,255,255,0.14);
  }
  .hist-ex{
    font-size:13px;
    padding-top:10px;
  }
  .hist-ex b{font-weight:700;}
  .hist-ex .sets-txt{color:var(--text-muted);}
  .progress-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.14);
    font-size:14px;
    position:relative;
  }
  .progress-row:last-child{border-bottom:none;}
  .progress-row .pname{color:var(--text);}
  .progress-row .pval{
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .empty{
    color:var(--text-muted);
    font-size:14px;
    text-align:center;
    padding:24px 0;
  }
  .settings-link{
    text-align:center;
    margin-top:24px;
    position:relative;
  }
  .tabbar{
    position:relative;
    display:flex;
    justify-content:space-around;
    align-items:center;
    margin-bottom:16px;
    padding:8px 4px;
    background:var(--glass-strong);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:26px;
    box-shadow:0 12px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .tabbar button{
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    color:var(--text-muted);
    font-family:var(--font-body);
    font-size:10px;
    font-weight:700;
    padding:7px 6px;
    border-radius:16px;
    cursor:pointer;
    flex:1;
  }
  .tabbar button .icon{font-size:18px; line-height:1;}
  .tabbar button.active{
    color:var(--text);
    background:rgba(255,255,255,0.16);
  }

</style>
</head>
<body>
<div class="bg-scene" aria-hidden="true">
<svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#242226"/>

<script>
const PROGRAM = {
  A: [
    { name: 'Приседания со штангой', sets: 3, repsMin: 8, repsMax: 10 },
    { name: 'Жим штанги лёжа', sets: 3, repsMin: 8, repsMax: 10 },
    { name: 'Тяга штанги в наклоне', sets: 3, repsMin: 8, repsMax: 10 },
    { name: 'Жим гантелей сидя', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Разгибание ног в тренажёре', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Разгибание рук на блоке', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Подъём гантелей на бицепс', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Планка', sets: 3, repsMin: 30, repsMax: 45, isTime: true },
    { name: 'Русские скручивания', sets: 3, repsMin: 15, repsMax: 20 }
  ],
  B: [
    { name: 'Становая тяга', sets: 3, repsMin: 6, repsMax: 8 },
    { name: 'Жим ногами / выпады', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Сгибание ног в тренажёре', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Тяга верхнего блока', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Жим гантелей на наклонной скамье', sets: 3, repsMin: 10, repsMax: 12 },
    { name: 'Разведение гантелей в стороны', sets: 3, repsMin: 12, repsMax: 15 },
    { name: 'Подъём ног в висе', sets: 3, repsMin: 15, repsMax: 15 },
    { name: 'Скручивания на блоке', sets: 3, repsMin: 15, repsMax: 20 }
  ]
};
const TYPE_LABELS = { A: 'Тренировка A', B: 'Тренировка B' };
const TABS = [
  { id: 'today', label: 'Сегодня', icon: '🏠' },
  { id: 'exercises', label: 'Упражнения', icon: '🏋️' },
  { id: 'settings', label: 'Настройки', icon: '⚙️' },
  { id: 'history', label: 'История', icon: '🕓' },
  { id: 'progress', label: 'Прогресс', icon: '📈' }
];

let sessions = [];
let overrides = {};
let view = 'loading';
let activeType = null;
let draft = null;
let resetArmed = false;
let overridesResetArmed = false;

function todayStr(d){
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function formatDateRu(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const s = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function nextType(){
  return sessions.length % 2 === 0 ? 'A' : 'B';
}
function todaysSession(){
  return sessions.find(s => s.date === todayStr());
}
function lastPerformance(name){
  for (let i = sessions.length - 1; i >= 0; i--){
    const ex = sessions[i].exercises.find(e => e.name === name);
    if (ex) return { date: sessions[i].date, sets: ex.sets, isTime: ex.isTime };
  }
  return null;
}
function hintText(perf){
  if (!perf) return 'ещё не выполнялось';
  const txt = perf.sets.map(s => perf.isTime ? (s.value1+'сек') : (s.value1+'кг×'+s.value2)).join(', ');
  return 'прошлый раз: ' + txt;
}
function videoSearchUrl(name){
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + ' техника выполнения');
}
function getConfig(ex){
  const o = overrides[ex.name] || {};
  return {
    name: ex.name,
    isTime: !!ex.isTime,
    sets: o.sets != null ? o.sets : ex.sets,
    repsMin: o.repsMin != null ? o.repsMin : ex.repsMin,
    repsMax: o.repsMax != null ? o.repsMax : ex.repsMax
  };
}
function targetText(cfg){
  const unit = cfg.isTime ? 'сек' : 'повторений';
  return cfg.repsMin === cfg.repsMax ? (cfg.repsMin + ' ' + unit) : (cfg.repsMin + '–' + cfg.repsMax + ' ' + unit);
}

function tgInitData(){
  try{
    const wa = window.Telegram && window.Telegram.WebApp;
    return (wa && wa.initData) ? wa.initData : null;
  }catch(e){
    return null;
  }
}
function authHeader(){
  const initData = tgInitData();
  if (initData) return { 'Authorization': 'tma ' + initData };
  const token = localStorage.getItem('training-log:token');
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}
async function loadAll(){
  try{
    const res = await fetch('/api/data', { headers: authHeader() });
    if (res.status === 401) return { unauthorized: true };
    if (!res.ok) throw new Error('bad status ' + res.status);
    const data = await res.json();
    return {
      sessions: Array.isArray(data.sessions) ? data.sessions : [],
      overrides: (data.overrides && typeof data.overrides === 'object') ? data.overrides : {},
      draft: data.draft || null
    };
  }catch(e){
    console.error('Load error', e);
    return { sessions: [], overrides: {}, draft: null };
  }
}
async function saveAll(){
  try{
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
      body: JSON.stringify({
        sessions,
        overrides,
        draft: activeType ? { type: activeType, exercises: draft } : null
      })
    });
    if (res.status === 401){
      localStorage.removeItem('training-log:token');
      view = 'login';
      render();
    }
  }catch(e){
    console.error('Save error', e);
  }
}
async function submitLoginCode(){
  const input = document.getElementById('loginCodeInput');
  const errEl = document.getElementById('loginError');
  const code = (input.value || '').trim();
  errEl.textContent = '';
  if (!/^\d{6}$/.test(code)){
    errEl.textContent = 'Код — это 6 цифр из бота';
    return;
  }
  try{
    const res = await fetch('/api/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (!res.ok || !data.token){
      errEl.textContent = data.error || 'Код неверный';
      return;
    }
    localStorage.setItem('training-log:token', data.token);
    view = 'loading';
    render();
    await startApp();
  }catch(e){
    errEl.textContent = 'Ошибка сети, попробуй ещё раз';
  }
}
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveAll, 600);
}
function updateOverride(name, field, value){
  const num = parseInt(value, 10);
  if (!overrides[name]) overrides[name] = {};
  if (!isNaN(num) && num > 0) overrides[name][field] = num;
  else delete overrides[name][field];
  if (Object.keys(overrides[name]).length === 0) delete overrides[name];
}
async function commitOverrides(){
  await saveAll();
}
async function resetOverrides(){
  if (!overridesResetArmed){
    overridesResetArmed = true;
    render();
    setTimeout(() => { overridesResetArmed = false; render(); }, 3000);
    return;
  }
  overrides = {};
  await saveAll();
  overridesResetArmed = false;
  render();
}

function startWorkout(type, prefill){
  activeType = type;
  draft = PROGRAM[type].map(ex => {
    const cfg = getConfig(ex);
    const prev = prefill && prefill.exercises.find(e => e.name === ex.name);
    return {
      name: ex.name,
      target: targetText(cfg),
      isTime: !!ex.isTime,
      sets: Array.from({length: cfg.sets}, (_, i) => ({
        value1: prev && prev.sets[i] ? prev.sets[i].value1 : '',
        value2: prev && prev.sets[i] ? prev.sets[i].value2 : '',
        done: prev && prev.sets[i] ? prev.sets[i].done : false
      }))
    };
  });
  view = 'workout';
  render();
  saveAll();
}
function editToday(){
  const s = todaysSession();
  if (s) startWorkout(s.type, s);
}
function resumeWorkout(){
  view = 'workout';
  render();
}
async function cancelWorkout(){
  activeType = null; draft = null; view = 'today'; render();
  await saveAll();
}
async function finishWorkout(){
  const entry = {
    date: todayStr(),
    type: activeType,
    exercises: draft.map(ex => ({
      name: ex.name,
      isTime: ex.isTime,
      sets: ex.sets.map(s => ({ value1: s.value1 || '0', value2: s.value2 || '0', done: s.done }))
    }))
  };
  sessions = sessions.filter(s => s.date !== entry.date);
  sessions.push(entry);
  sessions.sort((a,b) => a.date.localeCompare(b.date));
  activeType = null; draft = null; view = 'today';
  await saveAll();
  render();
}
function setVal(exIdx, setIdx, field, value){
  draft[exIdx].sets[setIdx][field] = value;
  scheduleSave();
}
function toggleDone(exIdx, setIdx){
  draft[exIdx].sets[setIdx].done = !draft[exIdx].sets[setIdx].done;
  render();
  saveAll();
}
function switchTab(v){
  view = v; render();
}
async function resetAll(){
  if (!resetArmed){
    resetArmed = true;
    render();
    setTimeout(() => { resetArmed = false; render(); }, 3000);
    return;
  }
  sessions = [];
  await saveAll();
  resetArmed = false;
  view = 'today';
  render();
}

function monthName(year, month){
  const d = new Date(year, month, 1);
  const s = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function daysInMonth(year, month){
  return new Date(year, month + 1, 0).getDate();
}
function monthGrid(year, month){
  const total = daysInMonth(year, month);
  const days = [];
  for (let day = 1; day <= total; day++){
    const ds = todayStr(new Date(year, month, day));
    const s = sessions.find(x => x.date === ds);
    days.push({ day, ds, letter: s ? s.type : null, isToday: ds === todayStr() });
  }
  return days;
}
function monthGridHtml(days){
  return days.map(d => `
    <div class="day-sq ${d.letter?'done':''} ${d.isToday?'today':''}" title="${d.ds}">${d.letter || d.day}</div>
  `).join('');
}
function pastMonths(){
  const now = new Date();
  const curKey = now.getFullYear() + '-' + now.getMonth();
  const seen = new Set();
  const months = [];
  sessions.forEach(s => {
    const d = new Date(s.date + 'T00:00:00');
    const key = d.getFullYear() + '-' + d.getMonth();
    if (key !== curKey && !seen.has(key)){
      seen.add(key);
      months.push({ year: d.getFullYear(), month: d.getMonth() });
    }
  });
  months.sort((a,b) => (b.year*12+b.month) - (a.year*12+a.month));
  return months;
}

function renderHeader(){
  return `
    <header>
      <h1>🐾 Дневник тренировок</h1>
      <div class="date">${formatDateRu(todayStr())}</div>
    </header>
  `;
}

function renderTabBar(active){
  return `
    <nav class="tabbar">
      ${TABS.map(t => `
        <button class="${active===t.id?'active':''}" onclick="switchTab('${t.id}')">
          <span class="icon">${t.icon}</span>
          <span>${t.label}</span>
        </button>
      `).join('')}
    </nav>
  `;
}

function renderToday(){
  const done = todaysSession();
  const inProgress = !done && activeType && draft;
  const type = done ? done.type : nextType();
  const countA = sessions.filter(s => s.type === 'A').length;
  const countB = sessions.filter(s => s.type === 'B').length;

  let heroHtml;
  if (done){
    heroHtml = `
      <div class="card accent-edge">
        <p class="eyebrow">Сегодня выполнено</p>
        <p class="hero-type">${TYPE_LABELS[done.type]}</p>
        <p class="exercise-preview">${PROGRAM[done.type].map(e=>e.name).join(' · ')}</p>
        <button class="btn btn-outline" onclick="editToday()">Изменить запись</button>
      </div>
    `;
  } else if (inProgress){
    heroHtml = `
      <div class="card accent-edge">
        <p class="eyebrow">Тренировка в процессе</p>
        <p class="hero-type">${TYPE_LABELS[activeType]}</p>
        <p class="exercise-preview">${draft.map(e=>e.name).join(' · ')}</p>
        <button class="btn btn-primary" onclick="resumeWorkout()">Продолжить тренировку</button>
      </div>
    `;
  } else {
    heroHtml = `
      <div class="card accent-edge">
        <p class="eyebrow">Следующая тренировка</p>
        <p class="hero-type">${TYPE_LABELS[type]}</p>
        <p class="exercise-preview">${PROGRAM[type].map(e=>e.name).join(' · ')}</p>
        <button class="btn btn-primary" onclick="startWorkout('${type}')">Начать тренировку</button>
      </div>
    `;
  }

  const now = new Date();
  const strip = monthGridHtml(monthGrid(now.getFullYear(), now.getMonth()));

  return `
    <div class="card">
      <p class="eyebrow" style="margin-bottom:10px;">${monthName(now.getFullYear(), now.getMonth())}</p>
      <div class="strip">${strip}</div>
      <div class="stats">
        <div class="stat"><div class="num">${sessions.length}</div><div class="lbl">тренировок всего</div></div>
        <div class="stat"><div class="num">${countA}</div><div class="lbl">тип A</div></div>
        <div class="stat"><div class="num">${countB}</div><div class="lbl">тип B</div></div>
      </div>
    </div>
    ${heroHtml}
  `;
}


function renderWorkout(){
  const exercisesHtml = draft.map((ex, exIdx) => {
    const perf = lastPerformance(ex.name);
    const setsHtml = ex.sets.map((s, setIdx) => {
      if (ex.isTime){
        return `
          <div class="set-row">
            <span class="set-label">${setIdx+1}</span>
            <input type="number" inputmode="numeric" placeholder="0" value="${s.value1}"
              oninput="setVal(${exIdx},${setIdx},'value1',this.value)">
            <span class="unit">сек</span>
            <button class="done-toggle ${s.done?'on':''}" onclick="toggleDone(${exIdx},${setIdx})">${s.done?'✓':''}</button>
          </div>
        `;
      }
      return `
        <div class="set-row">
          <span class="set-label">${setIdx+1}</span>
          <input type="number" inputmode="decimal" placeholder="кг" value="${s.value1}"
            oninput="setVal(${exIdx},${setIdx},'value1',this.value)">
          <span class="unit">кг</span>
          <input type="number" inputmode="numeric" placeholder="повт." value="${s.value2}"
            oninput="setVal(${exIdx},${setIdx},'value2',this.value)">
          <button class="done-toggle ${s.done?'on':''}" onclick="toggleDone(${exIdx},${setIdx})">${s.done?'✓':''}</button>
        </div>
      `;
    }).join('');
    return `
      <div class="exercise">
        <div class="ex-head">
          <div>
            <h3>${ex.name}</h3>
            <p class="target">${ex.target}</p>
          </div>
          <a class="video-btn" href="${videoSearchUrl(ex.name)}" target="_blank" rel="noopener">▶ Видео</a>
        </div>
        <p class="last-time">${hintText(perf)}</p>
        ${setsHtml}
      </div>
    `;
  }).join('');

  return `
    <div class="card">
      <p class="eyebrow">${TYPE_LABELS[activeType]}</p>
      ${exercisesHtml}
    </div>
    <div class="row-2">
      <button class="btn btn-outline" onclick="cancelWorkout()">Отмена</button>
      <button class="btn btn-primary" onclick="finishWorkout()">Завершить тренировку</button>
    </div>
  `;
}

function renderExercises(){
  const section = (label, list) => `
    <div class="card">
      <p class="eyebrow" style="margin-bottom:6px;">${label}</p>
      ${list.map(ex => {
        const cfg = getConfig(ex);
        return `
          <div class="lib-row">
            <div>
              <div class="lib-name">${ex.name}</div>
              <div class="target">${targetText(cfg)}, ${cfg.sets} подхода</div>
            </div>
            <a class="video-btn" href="${videoSearchUrl(ex.name)}" target="_blank" rel="noopener">▶ Видео</a>
          </div>
        `;
      }).join('')}
    </div>
  `;
  return `
    <p class="lib-note">Ссылка открывает поиск на YouTube по технике выполнения — выбери ролик, который понравится.</p>
    ${section('Тренировка A', PROGRAM.A)}
    ${section('Тренировка B', PROGRAM.B)}
  `;
}

function renderSettings(){
  const section = (label, list) => `
    <div class="card">
      <p class="eyebrow" style="margin-bottom:6px;">${label}</p>
      ${list.map(ex => {
        const cfg = getConfig(ex);
        return `
          <div class="cfg-row">
            <div class="cfg-name">${ex.name}</div>
            <div class="cfg-inputs">
              <label>Подходы
                <input type="number" inputmode="numeric" min="1" max="10" value="${cfg.sets}"
                  oninput="updateOverride('${ex.name}','sets',this.value)" onchange="commitOverrides()">
              </label>
              <label>${cfg.isTime ? 'Сек от' : 'Повт. от'}
                <input type="number" inputmode="numeric" min="1" max="200" value="${cfg.repsMin}"
                  oninput="updateOverride('${ex.name}','repsMin',this.value)" onchange="commitOverrides()">
              </label>
              <label>до
                <input type="number" inputmode="numeric" min="1" max="200" value="${cfg.repsMax}"
                  oninput="updateOverride('${ex.name}','repsMax',this.value)" onchange="commitOverrides()">
              </label>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  return `
    <p class="lib-note">Настрой количество подходов и повторений под себя. Изменения сохраняются и применяются при следующей тренировке.</p>
    ${section('Тренировка A', PROGRAM.A)}
    ${section('Тренировка B', PROGRAM.B)}
    <div class="settings-link">
      <button class="btn-ghost" onclick="resetOverrides()">${overridesResetArmed ? 'Точно сбросить к стандартным? Нажми ещё раз' : 'Сбросить к значениям по умолчанию'}</button>
    </div>
  `;
}

function renderHistory(){
  if (sessions.length === 0){
    return `<div class="card"><p class="empty">Пока нет записанных тренировок</p></div>`;
  }
  const monthCards = pastMonths().map(m => `
    <div class="card">
      <p class="eyebrow" style="margin-bottom:10px;">${monthName(m.year, m.month)}</p>
      <div class="strip">${monthGridHtml(monthGrid(m.year, m.month))}</div>
    </div>
  `).join('');
  const items = [...sessions].reverse().map(s => {
    const exHtml = s.exercises.map(ex => {
      const txt = ex.sets.map(st => ex.isTime ? (st.value1+'сек') : (st.value1+'кг×'+st.value2)).join(', ');
      return `<div class="hist-ex"><b>${ex.name}</b><br><span class="sets-txt">${txt}</span></div>`;
    }).join('');
    return `
      <details class="hist-item">
        <summary>
          <span>${formatDateRu(s.date)}</span>
          <span class="type-badge">Тип ${s.type}</span>
        </summary>
        <div class="hist-body">${exHtml}</div>
      </details>
    `;
  }).join('');
  return monthCards + items;
}

function renderProgress(){
  const all = [...PROGRAM.A, ...PROGRAM.B];
  const rows = all.map(ex => {
    const perf = lastPerformance(ex.name);
    let val = '—';
    if (perf){
      const best = perf.isTime
        ? Math.max(...perf.sets.map(s => Number(s.value1)||0)) + ' сек'
        : Math.max(...perf.sets.map(s => Number(s.value1)||0)) + ' кг';
      val = best + ' · ' + formatDateRu(perf.date).split(',')[0];
    }
    return `<div class="progress-row"><span class="pname">${ex.name}</span><span class="pval">${val}</span></div>`;
  }).join('');
  return `
    <div class="card">${rows}</div>
    <div class="settings-link">
      <button class="btn-ghost" onclick="resetAll()">${resetArmed ? 'Точно удалить всё? Нажми ещё раз' : 'Сбросить все данные'}</button>
    </div>
  `;
}

function renderLogin(){
  return `
    <div class="card accent-edge">
      <p class="eyebrow">Вход</p>
      <p class="hero-type" style="font-size:24px;">Код из Telegram</p>
      <p class="exercise-preview">Напиши /start своему боту-дневнику — он пришлёт код. Введи его сюда:</p>
      <div class="set-row" style="margin-bottom:14px;">
        <input id="loginCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="000000"
          style="text-align:center; font-size:22px; letter-spacing:6px;"
          onkeydown="if(event.key==='Enter') submitLoginCode()">
      </div>
      <button class="btn btn-primary" onclick="submitLoginCode()">Войти</button>
      <p id="loginError" style="color:var(--accent-2); font-size:13px; margin-top:12px;"></p>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if (view === 'loading'){
    app.innerHTML = renderHeader() + '<p class="empty">Загрузка…</p>';
    return;
  }
  if (view === 'login'){
    app.innerHTML = renderHeader() + renderLogin();
    return;
  }
  const activeTab = view === 'workout' ? 'today' : view;
  let body = '';
  if (view === 'today') body = renderToday();
  else if (view === 'workout') body = renderWorkout();
  else if (view === 'exercises') body = renderExercises();
  else if (view === 'settings') body = renderSettings();
  else if (view === 'history') body = renderHistory();
  else if (view === 'progress') body = renderProgress();
  app.innerHTML = renderHeader() + renderTabBar(activeTab) + body;
}

async function startApp(){
  const data = await loadAll();
  if (data.unauthorized){
    localStorage.removeItem('training-log:token');
    view = 'login';
    render();
    return;
  }
  sessions = data.sessions;
  overrides = data.overrides;
  if (data.draft && data.draft.type && PROGRAM[data.draft.type] && Array.isArray(data.draft.exercises)){
    activeType = data.draft.type;
    draft = data.draft.exercises;
    view = 'workout';
  } else {
    view = 'today';
  }
  render();
}

(function init(){
  try{ if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.ready(); }catch(e){}
  render();
  const inTelegram = !!tgInitData();
  const hasToken = !!localStorage.getItem('training-log:token');
  if (inTelegram || hasToken){
    startApp();
  } else {
    view = 'login';
    render();
  }
})();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && activeType){
    clearTimeout(saveTimer);
    saveAll();
  }
});
</script>
</body>
</html>
